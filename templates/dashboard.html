<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    header { display: flex; align-items: stretch; }
    nav { display: flex; }
    nav button { background: #ccc; border: 1px solid #888; border-bottom: none;
                 padding: 10px 18px; cursor: pointer; }
    nav button.active { background: #fff; font-weight: bold; }
    .bar { flex: 1; background: #a64ca6; display: flex;
           justify-content: flex-end; align-items: center; padding-right: 12px; }
    .bar img { height: 32px; }
    .tab { display: none; padding: 20px; }
    .tab.active { display: block; }
    .empty { display: flex; align-items: center; justify-content: center;
             min-height: 60vh; border: 2px dashed #ccc; border-radius: 8px;
             color: #777; font-size: 1.2em; }
    .grp { margin: 12px 0; }
    input, select { padding: 6px; margin: 4px 0; }
  </style>
</head>
<body>
  <header>
    <nav>
      <button class="active" onclick="showTab('pedidos', this)">Pedidos</button>
      <button onclick="showTab('productos', this)">Productos</button>
      <button onclick="showTab('agregar', this)">Agregar producto</button>
    </nav>
    <div class="bar">
      <img src="{{ url_for('static', filename='logo_placeholder.png') }}" alt="Logo">
    </div>
  </header>

  {% include 'orders_panel.html' %}
  {% include 'products_panel.html' %}
  {% include 'add_product_panel.html' %}

  <script>
    function showTab(id, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
