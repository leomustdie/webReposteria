<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moka &amp; Cake | Panel del personal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="dashboard">
  <header class="encabezado">
    <nav class="pestanas">
      <button type="button" data-tab="pedidos" class="activa">Pedidos</button>
      <button type="button" data-tab="productos">Productos</button>
      <button type="button" data-tab="agregar">Agregar producto</button>
    </nav>
    <div class="barra">
      <a href="{{ url_for('logout') }}" title="Cerrar sesión">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="Moka &amp; Cake - cerrar sesión">
      </a>
    </div>
  </header>

  <main class="contenido-panel">
    {% include 'orders_panel.html' %}
    {% include 'products_panel.html' %}
    {% include 'add_product_panel.html' %}
  </main>

  {% include 'notification.html' %}

  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
