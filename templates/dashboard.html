<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    header { display: flex; align-items: stretch; }
    nav { display: flex; }
    nav button { background: #ccc; border: 1px solid #888; border-bottom: none;
                 padding: 10px 18px; cursor: pointer; }
    nav button.active { background: #fff; font-weight: bold; }
    .bar { flex: 1; background: #a64ca6; display: flex;
           justify-content: flex-end; align-items: center; padding-right: 12px; }
    .bar img { height: 32px; }
    .tab { display: none; padding: 20px; }
    .tab.active { display: block; }
    .grp { margin: 12px 0; }
    .grp:not(:has(.opt)) { display: none; }  /* hide empty groups */
    input, select { padding: 6px; margin: 4px 0; }
  </style>
</head>
<body>
  <header>
    <nav>
      <button class="active" onclick="showTab('pedidos', this)">Pedidos</button>
      <button onclick="showTab('productos', this)">Productos</button>
      <button onclick="showTab('agregar', this)">Agregar producto</button>
    </nav>
    <div class="bar">
      <img src="{{ url_for('static', filename='logo_placeholder.png') }}" alt="Logo">
    </div>
  </header>

  <section id="pedidos" class="tab active"></section>
  <section id="productos" class="tab"></section>

  <section id="agregar" class="tab">
    <form method="POST" action="/dashboard/products">
      <input name="name" placeholder="Nombre" required><br>
      <input name="description" placeholder="Descripción"><br>
      <input name="price" type="number" placeholder="Precio (pts)" required><br>
      <select name="category" required>
        <option value="">Categoría</option>
        {% for c in categories %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
      

      <hr>
      <select onchange="addOpt(this)">
        <option value="">Agregar opción</option>
        <option value="single">Singular</option>
        <option value="multi">Múltiple</option>
        <option value="quantity">Cantidad</option>
      </select>

      <div class="grp"><h4>Singular</h4><div id="single"></div></div>
      <div class="grp"><h4>Múltiple</h4><div id="multi"></div></div>
      <div class="grp"><h4>Cantidad</h4><div id="quantity"></div></div>

      <button type="submit">Agregar</button>
      <button type="reset">Cancelar</button>
    </form>
  </section>

  <script>
    function showTab(id, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }

    function addOpt(sel) {
      if (!sel.value) return;
      const row = document.createElement('div');
      row.className = 'opt';
      row.innerHTML = `<input name="${sel.value}" placeholder="Nombre" required>
                       <button type="button" onclick="this.parentElement.remove()">✕</button>`;
      document.getElementById(sel.value).appendChild(row);
      sel.value = '';  // back to "Agregar opción"
    }
  </script>
</body>
</html>
