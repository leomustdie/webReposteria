<article class="producto{% if not product.status %} inactivo{% endif %}" data-product-id="{{ product.product_id }}">
  {% if product.photo %}
  <img class="producto-foto" src="{{ url_for('static', filename=product.photo) }}" alt="">
  {% else %}
  <div class="producto-foto sin-foto" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <circle cx="9" cy="10" r="1.6"/>
      <path d="M21 16l-5-5-8 9"/>
    </svg>
  </div>
  {% endif %}

  <div class="producto-info">
    <h3>{{ product.product_name }} · {{ product.price }} pts</h3>
    {% if product.description %}<p>{{ product.description }}</p>{% endif %}
  </div>

  <label class="switch" title="Disponible">
    <input type="checkbox" data-accion="disponibilidad" aria-label="Disponible"{% if product.status %} checked{% endif %}>
    <span class="slider"></span>
  </label>
</article>
