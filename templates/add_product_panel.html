<section id="agregar" class="tab">
  {% set tipos = {'single': 'Singular', 'multi': 'Múltiple', 'quantity': 'Cantidad'} %}

  <div class="tarjeta formulario">
    <h2>Agregar producto</h2>

    <form method="POST" action="/dashboard/products" enctype="multipart/form-data"
          onreset="imgName.textContent = ''">
      <div class="campo">
        <label for="product_name">Nombre</label>
        <input id="product_name" name="product_name" placeholder="Nombre del producto" required>
      </div>

      <div class="campo">
        <label for="description">Descripción</label>
        <input id="description" name="description" placeholder="Descripción">
      </div>

      <div class="campo">
        <label for="price">Precio (pts)</label>
        <input id="price" name="price" type="number" min="0" placeholder="Precio en puntos" required>
      </div>

      <div class="campo">
        <label for="making_time">Tiempo de preparación (min)</label>
        <input id="making_time" name="making_time" type="number" min="0" placeholder="Minutos" required>
      </div>

      <div class="campo">
        <label for="category_id">Categoría</label>
        <select id="category_id" name="category_id" required>
          <option value="">Selecciona una categoría</option>
          {% for c in categories %}
          <option value="{{ c.category_id }}">{{ c.category_name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="campo">
        <label>Imagen</label>
        <div class="imagen-fila">
          <input type="file" name="photo" id="photo" accept="image/*" hidden
                 onchange="imgName.textContent = this.files[0]?.name || ''">
          <button type="button" class="btn btn-secundario" onclick="photo.click()">Subir imagen</button>
          <span id="imgName"></span>
        </div>
      </div>

      <h3>Opciones</h3>
      {% for g in option_groups %}
      <div class="grupo-opciones">
        <h4>{{ g.group }} <small>({{ tipos[g.type] }})</small></h4>
        <div class="opciones-lista">
          {% for o in g.choices %}
          <label class="opcion">
            <input type="checkbox" name="option_ids" value="{{ o.id }}">
            {{ o.name }} <small>(+{{ o.extra_price }} pts)</small>
          </label>
          {% endfor %}
        </div>
      </div>
      {% else %}
      <p>No hay opciones registradas</p>
      {% endfor %}

      <div class="acciones">
        <button type="reset" class="btn btn-secundario">Cancelar</button>
        <button type="submit" class="btn">Agregar</button>
      </div>
    </form>
  </div>
</section>
