<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login Práctica Web</title>
<style>
body { font-family: Arial, sans-serif; background-color: #a14179;display: flex; justify-content: center; align-items: center; height:100vh; margin: 0; }
.card { background: white; padding: 25px; border-radius: 8px;box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
h2 { color: #1A365D; margin-top: 0; }
input { width: 100%; padding: 10px; margin: 8px 0; border: 1pxsolid #ccc; border-radius: 4px; box-sizing: border-box; }
button { width: 100%; padding: 10px; background: #1B4D3E; color:white; border: none; border-radius: 4px; cursor: pointer; font-weight:bold; }
button:hover { background: #143b2f; }
.error { color: #8B0000; font-size: 14px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="card">
<h2>Iniciar Sesión</h2>
{% if error %}
<p class="error"><b>{{ error }}</b></p>
{% endif %}

<form action="/login" method="POST">
<label for="usuario">Usuario:</label>
<input type="text" id="usuario" name="usuario" required>

<label for="password">Contraseña:</label>
<input type="password" id="password" name="password"required>

<button type="submit">Entrar</button>
</form>
</div>
</body>
</html>
