<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moka &amp; Cake | Acceso al personal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(ellipse at 50% 40%, #fffaf3, #e9ded0);
            color: #50382e;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        main {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 40px 24px;
        }

        .contenido {
            width: 100%;
            max-width: 640px;
            text-align: center;
        }

        /* ---------- Identidad visual compartida con el Home ---------- */

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 26px;
            display: grid;
            place-items: center;
            border: 1px solid #bda58f;
            border-radius: 50%;
            color: #50382e;
        }

        .categoria {
            color: #397e76;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        h1 {
            font: normal clamp(42px, 8vw, 76px)/1.1 Georgia, serif;
            margin: 15px 0 18px;
        }

        .linea {
            width: 45px;
            height: 2px;
            background: #397e76;
            margin: 0 auto 22px;
        }

        .mensaje {
            color: #756155;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
        }

        /* ---------------------- Tarjeta de acceso ---------------------- */

        .tarjeta {
            margin-top: 36px;
            padding: clamp(24px, 5vw, 38px);
            background: #fffdf8;
            border: 1px solid #e6dac9;
            border-radius: 14px;
            box-shadow: 0 20px 45px -28px rgba(80, 56, 46, .55),
                        0 2px 6px rgba(80, 56, 46, .06);
            text-align: left;
        }

        .tarjeta h2 {
            font: normal clamp(27px, 4vw, 34px)/1.2 Georgia, serif;
            color: #50382e;
            text-align: center;
            margin: 0 0 26px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            font-size: 15px;
            color: #50382e;
            margin-bottom: 7px;
        }

        .campo input {
            width: 100%;
            padding: 13px 15px;
            font: inherit;
            font-size: 15px;
            color: #50382e;
            background: #fffefa;
            border: 1px solid #ded0be;
            border-radius: 8px;
            transition: border-color .2s, box-shadow .2s;
        }

        .campo input::placeholder {
            color: #a2938a;
        }

        .campo input:focus {
            outline: none;
            border-color: #397e76;
            box-shadow: 0 0 0 3px rgba(57, 126, 118, .18);
        }

        .error {
            margin: 0 0 18px;
            padding: 11px 14px;
            font-size: 14px;
            color: #8a3a2e;
            background: #fdf2ef;
            border: 1px solid #efcdc5;
            border-radius: 8px;
        }

        .entrar {
            width: 100%;
            margin-top: 4px;
            padding: 14px;
            font: inherit;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            background: #397e76;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s;
        }

        .entrar:hover {
            background: #2f6a63;
        }

        .entrar:focus-visible {
            outline: 2px solid #397e76;
            outline-offset: 2px;
        }

        /* ------------------------- Volver al inicio ------------------------- */

        footer {
            display: flex;
            justify-content: center;
            padding: 0 24px 28px;
        }

        .volver {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #756155;
            font-size: 13px;
            text-decoration: none;
            padding: 7px 9px;
            border-radius: 5px;
            transition: color .2s, background .2s;
        }

        .volver:hover {
            color: #397e76;
            background: #fffaf3;
        }

        .volver:focus-visible {
            outline: 2px solid #397e76;
        }

        /* --------------------------- Responsive --------------------------- */

        @media (max-width: 640px) {
            main {
                padding: 28px 18px;
            }

            .contenido {
                max-width: 100%;
            }

            .logo {
                width: 66px;
                height: 66px;
                margin-bottom: 22px;
            }

            .mensaje {
                font-size: 15px;
            }

            .tarjeta {
                margin-top: 28px;
                padding: 24px 20px;
                border-radius: 12px;
            }

            .tarjeta h2 {
                margin-bottom: 22px;
            }

            footer {
                padding: 0 18px 22px;
            }
        }

        @media (max-height: 700px) and (min-width: 641px) {
            main {
                padding: 24px;
            }

            .logo {
                width: 64px;
                height: 64px;
                margin-bottom: 18px;
            }

            .tarjeta {
                margin-top: 24px;
            }
        }
    </style>
</head>

<body>

    <main>
        <div class="contenido">

            <div class="logo" aria-hidden="true">
                <svg width="36" height="36" viewBox="0 0 32 32"
                    fill="none" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M5 13h19v7a7 7 0 0 1-7 7h-5a7 7 0 0 1-7-7z
                    M24 14h2a4 4 0 0 1 0 8h-2
                    M3 30h25
                    M11 9c-3-3 3-4 0-7
                    M18 9c-3-3 3-4 0-7"/>
                </svg>
            </div>

            <span class="categoria">Café y repostería</span>

            <h1>Moka &amp; Cake</h1>

            <div class="linea"></div>

            <p class="mensaje">Bienvenido a nuestro espacio.</p>

            <section class="tarjeta">
                <h2>Acceso al personal</h2>

                {% if error %}
                <p class="error">{{ error }}</p>
                {% endif %}

                <form action="/login" method="POST">
                    <div class="campo">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" name="usuario"
                            placeholder="Ingresa tu usuario" required
                            autocomplete="username">
                    </div>

                    <div class="campo">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password"
                            placeholder="Ingresa tu contraseña" required
                            autocomplete="current-password">
                    </div>

                    <button class="entrar" type="submit">Iniciar sesión</button>
                </form>
            </section>

        </div>
    </main>

    <footer>
        <a class="volver" href="/home">

            <svg aria-hidden="true" width="14" height="14"
                viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">

                <path d="M19 12H5"/>
                <path d="M12 19l-7-7 7-7"/>

            </svg>

            Volver al inicio
        </a>
    </footer>

</body>
</html>
