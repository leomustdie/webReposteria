<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moka &amp; Cake | Acceso al personal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="pagina-login">

    <main>
        <div class="contenido">

            <div class="logo" aria-hidden="true">
                <svg width="36" height="36" viewBox="0 0 32 32"
                    fill="none" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M5 13h19v7a7 7 0 0 1-7 7h-5a7 7 0 0 1-7-7z
                    M24 14h2a4 4 0 0 1 0 8h-2
                    M3 30h25
                    M11 9c-3-3 3-4 0-7
                    M18 9c-3-3 3-4 0-7"/>
                </svg>
            </div>

            <span class="categoria">Café y repostería</span>

            <h1>Moka &amp; Cake</h1>

            <div class="linea"></div>

            <p class="mensaje">Bienvenido a nuestro espacio.</p>

            <section class="tarjeta">
                <h2>Acceso al personal</h2>

                {% if error %}
                <p class="error">{{ error }}</p>
                {% endif %}

                <form action="/login" method="POST">
                    <div class="campo">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" name="usuario"
                            placeholder="Ingresa tu usuario" required
                            autocomplete="username">
                    </div>

                    <div class="campo">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password"
                            placeholder="Ingresa tu contraseña" required
                            autocomplete="current-password">
                    </div>

                    <button class="entrar" type="submit">Iniciar sesión</button>
                </form>
            </section>

        </div>
    </main>

    <footer>
        <a class="volver" href="/home">

            <svg aria-hidden="true" width="14" height="14"
                viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">

                <path d="M19 12H5"/>
                <path d="M12 19l-7-7 7-7"/>

            </svg>

            Volver al inicio
        </a>
    </footer>

</body>
</html>
